<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 90" width="460" height="90">
  <defs>
    <radialGradient id="bannerGold" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff4d0" />
      <stop offset="60%" stop-color="#d4af37" />
      <stop offset="100%" stop-color="#9a7617" />
    </radialGradient>
    <radialGradient id="sealBg" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="70%" stop-color="#f5f2db" />
      <stop offset="100%" stop-color="#e8e0be" />
    </radialGradient>
    <path id="miniTopArc" d="M 12,45 A 33,33 0 0,1 78,45" fill="none" />
    <path id="miniBottomArc" d="M 78,45 A 33,33 0 0,1 12,45" fill="none" />
  </defs>

  <!-- Left: SRM AP Official Seal -->
  <g transform="translate(0, 0)">
    <circle cx="45" cy="45" r="42" fill="#1b1502" stroke="url(#bannerGold)" stroke-width="2" />
    <circle cx="45" cy="45" r="39" fill="none" stroke="url(#bannerGold)" stroke-width="0.8" />
    <circle cx="45" cy="45" r="28" fill="url(#sealBg)" stroke="url(#bannerGold)" stroke-width="1.2" />

    <!-- Inscription text around miniature seal -->
    <text fill="url(#bannerGold)" font-family="Georgia, serif" font-weight="bold" font-size="6.8" letter-spacing="1">
      <textPath href="#miniTopArc" startOffset="50%" text-anchor="middle">SRM UNIVERSITY</textPath>
    </text>
    <text fill="url(#bannerGold)" font-family="Georgia, serif" font-weight="bold" font-size="7" letter-spacing="2">
      <textPath href="#miniBottomArc" startOffset="50%" text-anchor="middle">★ AP ★</textPath>
    </text>

    <!-- Mini Tree of Knowledge in Center -->
    <path d="M 45,62 C 44,57 43,53 43,49 C 42,47 41,45 39,43 C 42,44 43,45 45,47 C 47,45 48,44 51,43 C 49,45 48,47 47,49 C 47,53 46,57 45,62 Z" fill="#4d3806" />
    <!-- Leaf canopy -->
    <g fill="#708c33" stroke="#48601c" stroke-width="0.2">
      <ellipse cx="45" cy="35" rx="3.5" ry="5.5" />
      <ellipse cx="41" cy="37" rx="3" ry="5" transform="rotate(-20 41 37)" />
      <ellipse cx="49" cy="37" rx="3" ry="5" transform="rotate(20 49 37)" />
      <ellipse cx="37" cy="41" rx="3" ry="4.5" transform="rotate(-40 37 41)" />
      <ellipse cx="53" cy="41" rx="3" ry="4.5" transform="rotate(40 53 41)" />
      <ellipse cx="34" cy="47" rx="2.5" ry="4" transform="rotate(-60 34 47)" />
      <ellipse cx="56" cy="47" rx="2.5" ry="4" transform="rotate(60 56 47)" />
      <ellipse cx="45" cy="43" rx="3" ry="4" />
      <ellipse cx="41" cy="46" rx="2" ry="3" fill="#b09532" />
      <ellipse cx="49" cy="46" rx="2" ry="3" fill="#b09532" />
    </g>
  </g>

  <!-- Right: Official Typography -->
  <!-- "SRM" -->
  <text x="105" y="48" fill="#ffffff" font-family="'Times New Roman', Times, Georgia, serif" font-weight="900" font-size="52" letter-spacing="3">SRM</text>

  <!-- "UNIVERSITY" -->
  <text x="240" y="47" fill="#ffffff" font-family="'Times New Roman', Times, Georgia, serif" font-weight="700" font-size="28" letter-spacing="4">UNIVERSITY</text>

  <!-- Underline rule & "Andhra Pradesh" -->
  <line x1="105" y1="58" x2="445" y2="58" stroke="url(#bannerGold)" stroke-width="1.2" opacity="0.8" />
  <text x="275" y="76" fill="url(#bannerGold)" font-family="'Times New Roman', Times, Georgia, serif" font-style="italic" font-weight="bold" font-size="16.5" letter-spacing="2" text-anchor="middle">
    Andhra Pradesh
  </text>
</svg>
